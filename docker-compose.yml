# Full local stack. `make up` starts everything; `make dev` only needs postgres.
name: reconmind

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconmind
      POSTGRES_PASSWORD: reconmind
      POSTGRES_DB: reconmind
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconmind"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    profiles: ["full"]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b} && wait"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: .
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reconmind:reconmind@postgres:5432/reconmind
      DEMO_MODE: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      SEED_SAMPLE: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  ollama:

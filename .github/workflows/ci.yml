name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconmind
          POSTGRES_PASSWORD: reconmind
          POSTGRES_DB: reconmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reconmind"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://reconmind:reconmind@localhost:5432/reconmind_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  eval:
    name: ragas gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-eval-v1
      - run: uv sync --frozen --group eval
      # no API keys in CI: extractive answers, offline judges (see ADR 0006)
      - run: uv run python evals/run_ragas.py --answerer extractive --gate --out evals/results/ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ragas
          path: evals/results/ci.json
          if-no-files-found: ignore

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scan full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  web:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: "1"

  # What a reviewer does after cloning: `make bootstrap && make dev` in an empty directory,
  # then the API and the web app must answer and /ask must return a cited answer.
  fresh-clone:
    name: fresh clone
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: reconmind
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: reconmind/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reconmind/frontend/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-fresh-clone-v1
      - name: make bootstrap
        working-directory: reconmind
        run: make bootstrap
      - name: make dev, then use it
        working-directory: reconmind
        run: |
          (make dev > dev.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -sf localhost:8000/healthz > /dev/null && curl -sf -o /dev/null localhost:3000/; then break; fi
            sleep 5
          done
          curl -sf localhost:8000/healthz | tee healthz.json | jq -e '.status == "ok" and .database == true'
          curl -sf -o /dev/null -w "web %{http_code}\n" localhost:3000/
          curl -sf localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "Which file wins when a submitter resends the same day?"}' \
            | tee ask.json | jq -e '(.answer | length) > 20 and (.sources | length) > 0'
      - name: dev server log
        if: failure()
        working-directory: reconmind
        run: tail -150 dev.log

  # The same golden set with a model writing the answers and a different model judging
  # them. Needs the GROQ_API_KEY secret; runs by hand and on release tags, not on every push.
  eval-model:
    name: ragas (model answers)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDERS: '["groq"]'
      LLM_CONCURRENCY: "1"
      LLM_TIMEOUT_S: "120"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-eval-v1
      - run: uv sync --frozen --group eval
      - name: model answers, offline judges
        run: uv run python evals/run_ragas.py --out evals/results/model-offline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: model answers, a different model judging
        run: |
          uv run python evals/run_ragas.py --judge llm --judge-model groq/qwen/qwen3.8-27b \
            --pause 4 --out evals/results/model-llm.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ragas-model
          path: evals/results/model-*.json
          if-no-files-found: ignore

  # Render redeploys the API only when told to: this calls the service's deploy hook once
  # every check on main has passed. Without the RENDER_DEPLOY_HOOK_URL secret it does nothing.
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, eval, secrets, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; deploy the API from the Render dashboard"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deploy of ${GITHUB_SHA::7} requested"

name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconmind
          POSTGRES_PASSWORD: reconmind
          POSTGRES_DB: reconmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reconmind"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://reconmind:reconmind@localhost:5432/reconmind_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  eval:
    name: ragas gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-eval-v1
      - run: uv sync --frozen --group eval
      # no API keys in CI: extractive answers, offline judges (see ADR 0006)
      - run: uv run python evals/run_ragas.py --answerer extractive --gate --out evals/results/ci.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ragas
          path: evals/results/ci.json
          if-no-files-found: ignore

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scan full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  web:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: "1"

name: Keep alive

# A free Render instance spins down after 15 minutes without traffic, and the first
# request after that takes up to a minute. While the project is being evaluated this
# keeps it awake from 03:00 to 19:00 UTC (08:30-00:30 in India, the US East Coast
# morning), until KEEP_ALIVE_UNTIL, a repository variable that defaults to 2026-10-19,
# the day the free database expires.
#
# GitHub runs scheduled workflows when it can, often an hour or more late, so a
# ten-minute cron alone leaves long gaps. Instead each hourly run pings every five
# minutes for fifty minutes. Free instance hours (750 a month) are shared by every free
# service in the Render workspace, which is why it doesn't run around the clock.
#
# To stop it: set KEEP_ALIVE_UNTIL to a past date (Settings -> Secrets and variables ->
# Actions -> Variables), or disable the workflow from the Actions tab.
on:
  schedule:
    - cron: "7 3-18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      API: ${{ vars.RECONMIND_API_URL || 'https://reconmind-labs-api.onrender.com' }}
      UNTIL: ${{ vars.KEEP_ALIVE_UNTIL || '2026-10-19' }}
    steps:
      - name: Ping the API every five minutes
        run: |
          if [[ "$(date -u +%F)" > "$UNTIL" ]]; then
            echo "past $UNTIL, not pinging"
            exit 0
          fi
          for i in $(seq 1 11); do
            if [ "$(date -u +%H)" -ge 19 ]; then break; fi
            curl -s -o /dev/null -w "$(date -u +%H:%M) %{http_code} %{time_total}s\n" \
              --max-time 90 "$API/healthz" || true
            sleep 300
          done

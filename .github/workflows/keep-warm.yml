name: Keep warm

# A free Render instance spins down after 15 minutes without traffic, and the first
# request after that takes up to a minute. Pinging /healthz keeps the public demo
# responsive while people are likely to look at it: 03:00-19:00 UTC covers the working
# day in India and the US East Coast morning. Free instance hours are shared across the
# Render workspace (750 a month), so it only pings until KEEP_WARM_UNTIL.
on:
  schedule:
    - cron: "*/10 3-18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: ${{ vars.RECONMIND_API_URL || 'https://reconmind-labs-api.onrender.com' }}
      UNTIL: ${{ vars.KEEP_WARM_UNTIL || '2026-10-05' }}
    steps:
      - name: Ping the API
        run: |
          if [[ "$(date -u +%F)" > "$UNTIL" ]]; then
            echo "past $UNTIL, not pinging"
            exit 0
          fi
          curl -sf --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 "$API/healthz"

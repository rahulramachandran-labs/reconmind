# One-click deploy: https://render.com/deploy?repo=https://github.com/rahulramachandran-labs/reconmind
# Render asks for the values marked sync: false when the blueprint is created.
services:
  - type: web
    name: reconmind-labs-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reconmind-db
          property: connectionString
      - key: SEED_SAMPLE
        value: "true"
      # one small container: MCP servers run in-process instead of as subprocesses
      - key: MCP_TRANSPORT
        value: inprocess
      # scans come from .github/workflows/scheduled-scan.yml; a free instance sleeps too
      # often for a timer inside the API to be useful
      - key: SCAN_INTERVAL_MINUTES
        value: "0"
      # the ONNX reranker adds ~220 MB and grows with use; 512 MB can't carry it (ADR 0003)
      - key: RERANKER
        value: none
      # no Ollama on the free tier; with no keys set, write-ups come from templates
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # free tiers: set any one of these and /healthz lists it under llm_providers
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      # the same value as RECONMIND_WRITE_TOKEN on the web app
      - key: WRITE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["https://reconmind-labs.vercel.app"]'

databases:
  - name: reconmind-db
    plan: free
    region: oregon
    databaseName: reconmind
    user: reconmind

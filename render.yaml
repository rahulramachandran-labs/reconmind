services:
  - type: web
    name: reconmind-labs-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reconmind-db
          property: connectionString
      - key: SEED_SAMPLE
        value: "true"
      # no Ollama on the free tier; with no keys set the API answers extractively
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://reconmind-labs.vercel.app"]'

databases:
  - name: reconmind-db
    plan: free
    region: oregon
    databaseName: reconmind
    user: reconmind

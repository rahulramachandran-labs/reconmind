repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(data/sample/|docs/slides/.*\.(pptx|pdf|png))
      - id: trailing-whitespace
        exclude: ^data/sample/
      - id: check-added-large-files
        args: ["--maxkb=6000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: mypy
        name: mypy (changed files)
        entry: uv run mypy --follow-imports=silent
        language: system
        types: [python]
        files: ^app/
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

[project]
name = "reconmind"
version = "0.1.0"
description = "Multi-agent, RAG-powered incident copilot for data pipelines: key drift, duplicate submissions, schema drift, volume anomalies."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rahul Ramachandran" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.60",
    "numpy>=1.26,<2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0,<4",
    "torch>=2.2.2",
    # torch 2.2.2 is the last release with Intel macOS wheels, and it needs transformers < 4.50
    "transformers>=4.41,<4.50 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.41 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.0",
    "python-json-logger>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-pyyaml",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "docs/slides"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S311"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = false
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "rank_bm25.*", "langchain_community.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "model: loads the real sentence-transformers model (slower, downloads weights once)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

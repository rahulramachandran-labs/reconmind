[project]
name = "reconmind"
version = "0.1.0"
description = "Multi-agent, RAG-powered incident copilot for data pipelines: key drift, duplicate submissions, schema drift, volume anomalies."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rahul Ramachandran" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.60",
    "numpy>=1.26,<2",
    "faiss-cpu>=1.8",
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.0",
    "python-json-logger>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.2",
    "rank-bm25>=0.2.2",
    "anthropic>=1.6.0",
    "pinecone>=10.0.0",
    "snowballstemmer>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11,!=2.3.1",  # 2.3.1 shipped without a compiled Intel macOS wheel
    "types-pyyaml",
    "pre-commit>=4.6.2",
]
# torch-backed models: sentence-transformers embeddings locally, cross-encoders for evals
local-models = [
    "sentence-transformers>=3.0,<4",
    "torch>=2.2.2",
    # torch 2.2.2 is the last release with Intel macOS wheels, and it needs transformers < 4.50
    "transformers>=4.41,<4.50 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.41 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# the same MiniLM weights through onnxruntime, for the slim hosted image
onnx = [
    "fastembed>=0.5 ; sys_platform == 'linux'",
]
eval = [
    "ragas>=0.4",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev", "local-models"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "docs/slides"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S311"]
"app/pipeline/synthetic.py" = ["S311"]
"evals/**" = ["S603", "S607", "E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = false
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# heavy libraries we only touch at the edges: treat them as Any instead of type
# checking torch and friends on every run
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "fastembed.*",
    "rank_bm25.*",
    "snowballstemmer.*",
    "langchain_community.*",
    "pinecone.*",
    "ragas.*",
    "datasets.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "model: loads the real sentence-transformers model (slower, downloads weights once)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
